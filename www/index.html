<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#38a9ff">
<title>小狗跳跳民國曆時鐘</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3fb3ff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
  #c{position:fixed;left:0;top:0;display:block;touch-action:none}
  .rb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(255,255,255,.78);font-size:19px;line-height:38px;padding:0;z-index:20}
  #fs{left:8px}#snd{right:8px}
  #panel{position:fixed;left:3vw;right:3vw;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2vh);z-index:10;
    background:rgba(255,255,255,.9);border:3px solid #2f6f3a;border-radius:18px;padding:8px 9px 9px;
    box-shadow:0 5px 0 #2f6f3a,0 8px 18px rgba(0,0,0,.25);color:#1f4f2a;box-sizing:border-box}
  .tabs{display:flex;gap:6px}
  .tabs button{flex:1;padding:8px 0;border:2px solid #2f6f3a;background:#fff;color:#2f6f3a;border-radius:12px;
    font-size:clamp(13px,3.8vw,16px);font-weight:800}
  .tabs button.on{background:#2f6f3a;color:#fff}
  .row{display:none;gap:4px;margin-top:8px}
  .row.show{display:flex}
  .row label{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;gap:2px}
  .row label.wide{flex:1.35}
  select{width:100%;font-size:16px;padding:7px 0;border-radius:9px;border:2px solid #2f6f3a;background:#fff;color:#1f4f2a;
    font-weight:700;text-align:center;text-align-last:center}
  #note{margin-top:7px;min-height:1.3em;font-size:13px;text-align:center;font-weight:700;color:#1f4f2a}
  #note.err{color:#c62828}
  #ok{display:block;width:100%;margin-top:6px;padding:11px 0;border:none;border-radius:14px;background:#ffb62e;color:#fff;
    font-size:19px;font-weight:900;letter-spacing:.3em;text-shadow:0 1px 0 #a65a00;box-shadow:0 4px 0 #b8661a}
  #ok:active{transform:translateY(3px);box-shadow:0 1px 0 #b8661a}
  #rot{position:fixed;inset:0;background:#2f6f3a;color:#fff;display:none;z-index:99999;
    align-items:center;justify-content:center;text-align:center;font-size:5vh;padding:10vh}
  @media (orientation:landscape){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fs" class="rb" aria-label="全螢幕">⛶</button>
<button id="snd" class="rb" aria-label="音樂">🔇</button>
<div id="panel">
  <div class="tabs">
    <button data-m="clock" class="on">目前時間</button>
    <button data-m="target">日期時間倒數</button>
    <button data-m="dur">倒數時間</button>
  </div>
  <div class="row" id="rowT">
    <label class="wide">民國年<select id="tY"></select></label>
    <label>月<select id="tMo"></select></label>
    <label>日<select id="tD"></select></label>
    <label>時<select id="tH"></select></label>
    <label>分<select id="tMi"></select></label>
    <label>秒<select id="tS"></select></label>
  </div>
  <div class="row" id="rowD">
    <label>時<select id="dH"></select></label>
    <label>分<select id="dMi"></select></label>
    <label>秒<select id="dS"></select></label>
  </div>
  <div id="note"></div>
  <button id="ok">確定</button>
</div>
<div id="rot">📱<br><br>請把手機直立使用</div>

const BGM={tick:function(){}};
</script>

const SP={},IMG={};let loaded=0;const total=META.sprites.length;
META.sprites.forEach(s=>{SP[s.name]=s;const im=new Image();im.onload=()=>{loaded++};im.src=s.uri;IMG[s.name]=im});
const PV=META.piv,VBW=META.vbw,VBH=META.vbh,D=Math.PI/180;
const part=n=>{const s=SP[n];ctx.drawImage(IMG[n],s.x,s.y,s.w,s.h)};
const THICK={bn:[1.55,1.12],bf:[2.0,1.5],fn:[1.2,1.12],ff:[2.7,2.0]};
function leg(k,a,b){
  const hp=PV[k+'_hip'],kp=PV[k+'_knee'],th=THICK[k]||[1,1];
  const u=SP[k+'_up'],l=SP[k+'_lo'],ux=u.x+u.w/2,lx=l.x+l.w/2;
  ctx.save();ctx.translate(hp[0],hp[1]);ctx.rotate(a*D);ctx.translate(-hp[0],-hp[1]);
  ctx.save();ctx.translate(kp[0],kp[1]);ctx.rotate(b*D);
  ctx.translate(lx-kp[0],0);ctx.scale(th[1],1);ctx.translate(-lx,-kp[1]);part(k+'_lo');ctx.restore();
  ctx.save();ctx.translate(ux,hp[1]);ctx.scale(th[0],1);ctx.translate(-ux,-hp[1]);part(k+'_up');ctx.restore();
  ctx.restore();
}
function drawDog(pose,tailAng){
  ctx.save();ctx.translate(PV.tail[0],PV.tail[1]);ctx.rotate(tailAng*D);ctx.translate(-PV.tail[0],-PV.tail[1]);part('tail');ctx.restore();
  leg('bf',pose.bf[0],pose.bf[1]);leg('ff',pose.ff[0],pose.ff[1]);
  leg('bn',pose.bn[0],pose.bn[1]);leg('fn',pose.fn[0],pose.fn[1]);
  part('body');
}

let AC=null,muted=false;
function snd(f0,f1,d,type,vol){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
    g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- 時間模型 ----------
   m = 整數秒（epoch 秒）。小狗在每個 m 的中間（m+0.5）躍過「m 對應的秒數字」。*/
let cfg={mode:'clock',end:0,label:''};      // mode: clock / cd
try{
  const sv=JSON.parse(localStorage.getItem('puppyClockCfg')||'null');
  if(sv&&sv.mode==='cd'&&sv.end>Date.now()/1000)cfg=sv;
}catch(e){}
function info(m){                              // 回傳該秒的資料；倒數結束後回 null
  if(cfg.mode==='clock'){
    const p=new Date((m+28800)*1000);          // 台北時間 UTC+8
    const y=p.getUTCFullYear()-1911,mo=p.getUTCMonth()+1,d=p.getUTCDate(),h=p.getUTCHours(),mi=p.getUTCMinutes(),s=p.getUTCSeconds();
    return {sec:s,line1:y+'年'+mo+'月'+d+'日',line2:pad2(h)+':'+pad2(mi)+':'+pad2(s),block:pad2(h)+':'+pad2(mi)};
  }
  const R=cfg.end-m;if(R<0)return null;
  const s=R%60,mi=Math.floor(R/60)%60,h=Math.floor(R/3600)%24,dd=Math.floor(R/86400);
  return {sec:s,line1:cfg.label,line2:(dd?dd+'天 ':'')+pad2(h)+':'+pad2(mi)+':'+pad2(s),block:(dd?dd+'天':'')+pad2(h)+':'+pad2(mi)};
}

const LF=(function(){try{return new Intl.DateTimeFormat('zh-TW-u-ca-chinese',{timeZone:'Asia/Taipei',year:'numeric',month:'numeric',day:'numeric'})}catch(e){return null}})();
const MN={'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11,'十二':12,'冬':11,'臘':12};
let lunarKey='',lunarTxt='';
function lunarOf(m){
  if(!LF)return '';
  const key=Math.floor((m+28800)/86400);
  if(key===lunarKey)return lunarTxt;
  let t='';
  try{
    const ps=LF.formatToParts(new Date(m*1000)),g=n=>(ps.find(p=>p.type===n)||{}).value||'';
    const ry=+g('relatedYear'),mo=g('month'),leap=mo.charAt(0)==='閏',mn=MN[mo.replace('閏','').replace('月','')]||mo.replace('月','');
    const st='甲乙丙丁戊己庚辛壬癸',br='子丑寅卯辰巳午未申酉戌亥',i=((ry-4)%60+60)%60;
    t='農曆'+st[i%10]+br[i%12]+'年'+(leap?'閏':'')+mn+'月'+g('day')+'日';
  }catch(e){}
  lunarKey=key;lunarTxt=t;return t;
}

const BARK=new Audio(BARK_URI);BARK.preload='auto';
let barkBuf=null,barkOut=null;
function prepBark(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(barkBuf||!AC)return;
    const bin=atob(BARK_URI.split(',')[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    AC.decodeAudioData(a.buffer,b=>{barkBuf=b},()=>{});
  }catch(e){}
}
let barkMaster=null;
function masterOut(){
  if(!AC)return null;
  if(!barkOut){barkOut=AC.createDynamicsCompressor();barkOut.threshold.value=-6;barkOut.ratio.value=12;
    barkMaster=AC.createGain();barkOut.connect(barkMaster);barkMaster.connect(AC.destination)}
  barkMaster.gain.value=muted?0:1;return barkOut;
}
function barkGain(i){return 1.5+6.5*(i/8)}      // 第 i 次（0~8）：增益 1.5 → 8，越叫越大聲
function bark(i){                               // 前景備援：立即播放第 i 聲
  if(muted)return;
  try{
    if(AC&&barkBuf){
      if(AC.state==='suspended')AC.resume();
      const src=AC.createBufferSource(),g=AC.createGain();src.buffer=barkBuf;g.gain.value=barkGain(i);src.connect(g);g.connect(masterOut());src.start();
      return;
    }
    BARK.volume=Math.min(1,0.4+0.6*(i/8));BARK.currentTime=0;BARK.play().catch(()=>{});
  }catch(e){}

function keepAlive(on){                         // 播放極小聲的循環音訊，讓手機把本頁視為媒體播放而不凍結
  try{
    if(on){
      if(!keepEl){keepEl=new Audio(MUTE_URI);keepEl.loop=true}
      keepEl.play().catch(()=>{});
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata=new MediaMetadata({title:'倒數計時中',artist:'小狗跳跳'});
        navigator.mediaSession.playbackState='playing';
        try{navigator.mediaSession.setActionHandler('pause',()=>{keepEl&&keepEl.play()})}catch(e){}
      }
    }else if(keepEl){
      keepEl.pause();
      if('mediaSession' in navigator)navigator.mediaSession.playbackState='none';
    }
  }catch(e){}
}
function bgCheck(){
  const now=Date.now()/1000,want=cfg.mode==='cd';                       // 倒數模式中（含鈴響中）持續保活，直到按「確定」
  keepAlive(want);
  if(want&&now<cfg.end){
    if(barkFor!==cfg.end||cfg.end-now>20&&Math.floor(now)%30===0)scheduleBarks();
  }
}
setInterval(bgCheck,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)bgCheck()});
let fgBarkTimer=null;
function stopBarking(){                          // 停止所有狗叫（前景與預排程）
  clearInterval(fgBarkTimer);fgBarkTimer=null;
  barkSrc.forEach(x=>{try{x.stop()}catch(e){}});barkSrc=[];barkFor=0;
  try{BARK.pause();BARK.currentTime=0}catch(e){}
}
function celebrate(){
  if(barkFor!==cfg.end){                         // 排程失效時的前景備援：持續狗叫直到按「確定」
    clearInterval(fgBarkTimer);let n=0;
    fgBarkTimer=setInterval(()=>{if(!finished){clearInterval(fgBarkTimer);return}bark(Math.min(n++,8))},900);
  }
  finished=true;finT=0;winAng=0;
  [523,659,784,1046,1318,1046,1318,1568].forEach((f,i)=>setTimeout(()=>snd(f,f*1.01,0.2,'triangle',0.08),i*140));
  for(let i=0;i<70;i++)confetti();
  try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(e){}
}

function zOf(tt){                               // 垂直位置（只和時間有關，不受幀率影響）
  if(bump){const d=tt-bump.t;return Math.max(0,bump.z+bump.v*d-0.5*GR*d*d)}
  if(tt<0||tt>=TJ)return 0;
  return VZ0*tt-0.5*GR*tt*tt;
}
function update(dt){
  clock+=dt;T=Date.now()/1000;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}
    p.vy+=U*(p.g||3)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>(pops[i].life||0.9))pops.splice(i,1)}
  for(let i=stars.length-1;i>=0;i--){stars[i].t+=dt;if(stars[i].t>1.2)stars.splice(i,1)}
  if(loaded<total)return;

  const mNow=Math.floor(T);
  if(cfg.mode==='cd'&&!finished&&T>=cfg.end+0.88){celebrate();if(T>cfg.end+15){finT=3}}
  if(cfg.mode==='clock'&&finished){finished=false}
  if(cfg.mode==='cd'&&finished&&T<cfg.end)finished=false;

  const sp=Math.min(1,0.9);
  tailAng=Math.sin(clock*22)*18;lean=0;bob=0;sx=1;sy=1;

  if(finished){                                  // 倒數結束：小狗在中央跳舞（沿用原檔勝利動作）
    finT+=dt;winAng+=dt*3.4;
    const k=Math.min(1,finT/0.6),cs=Math.cos(winAng)*k;
    dogX+=(W/2+U*0.2*Math.sin(winAng)*k-dogX)*Math.min(1,dt*6);
    dogScaleW=Math.cos(winAng)>=0?1:-1;
    wp+=dt*15;
    const c=wp,c2=wp+Math.PI,sw=(cc,A,B)=>[A*Math.sin(cc),B*Math.max(0,-Math.cos(cc))];
    pose={fn:sw(c,30,40),bf:sw(c,26,34),ff:sw(c2,30,40),bn:sw(c2,26,34)};
    const target=Math.abs(Math.sin(finT*6.5))*u*0.35;
    dogZ+=(target-dogZ)*Math.min(1,dt*18);
    sy=1+Math.cos(2*wp)*0.02;sx=1/sy;tailAng=Math.sin(clock*28)*30;
    if(Math.random()<0.4)confetti();
    if(finT>2&&Math.floor(finT*10)%40===0&&Math.random()<0.2)snd(880,1320,0.15,'triangle',0.05);
    return;
  }
  dogScaleW=1;

  /* 小狗位置（由時間決定）：每秒一個週期 */
  const tt0=T-POFF,k=Math.floor(tt0),uu=tt0-k;
  const jumping=uu<TJ;
  if(k!==lastK){lastK=k;bump=null;bumpK=k}
  dogX=XA+S*(k+0.5+POFF-T+0.0)+dogRel(uu)-S*POFF;   // 化簡：相對 k 號數字的位置
  // 上式 = XA + S*(k+0.5-T) + dogRel(uu)  （POFF 兩項互相抵銷，保留以便閱讀）
  const dtt=uu;                                  // 起跳後經過的秒數
  dogZ=zOf(dtt);
  dogVz=bump?(bump.v-GR*(dtt-bump.t)):(jumping?VZ0-GR*dtt:0);

  /* 方塊碰撞 */
  if(!bump&&jumping&&dogVz>0){
    for(let m=k-1;m<=k+2;m++){
      const inf=info(m);if(!inf||inf.sec!==0)continue;
      const h=hits[m]||(hits[m]={hit:0,t:0});if(h.hit)continue;
      const g=cubeGeom(m,inf.block);
      const hx0=dogX+0.40*u,hx1=dogX+0.78*u;
      if(hx1>g.x&&hx0<g.x+g.w&&dogZ+0.77*u>=HB){
        h.hit=1;h.t=0;
        bump={t:dtt,z:dogZ,v:-0.25*u};
        const cy=GY-HB-g.h;
        stars.push({wx:g.x+g.w/2,y0:cy,t:0});
        burst(g.x+g.w/2,cy+g.h,16,'#ffd84a',1.2);
        snd(880,1320,0.18,'triangle',0.08);setTimeout(()=>snd(1320,1760,0.22,'triangle',0.07),120);
        break;
      }
    }
  }
  for(const key in hits){const h=hits[key];if(h.hit)h.t+=dt;if(+key<mNow-4)delete hits[key]}

  /* 姿勢 */
  if(dogZ<=0.5&&!bump||(!jumping&&dogZ<=0.5)){
    wp+=dt*9;
    const c=wp,c2=wp+Math.PI,sw=(cc,A,B)=>[A*Math.sin(cc),B*Math.max(0,-Math.cos(cc))];
    pose={fn:sw(c,30,40),bf:sw(c,26,34),ff:sw(c2,30,40),bn:sw(c2,26,34)};
    bob=Math.abs(Math.sin(c))*U*0.006;sy=1+Math.cos(2*c)*0.02;sx=1/sy;lean=Math.sin(c)*1.5;
    if(uu>=TJ&&uu<TJ+0.1){const q=1-(uu-TJ)/0.1;sy*=1-0.07*q;sx*=1+0.04*q}
  }else{
    const ph=Math.max(-1,Math.min(1,-dogVz/VZ0));
    const t=(ph+1)/2,s=Math.sin(Math.PI*t),lerp=(a,b,t)=>a+(b-a)*t;
    sy=1+0.05*(1-Math.abs(ph));sx=1-0.03*(1-Math.abs(ph));
    lean=ph*8;tailAng=Math.sin(clock*26)*20;
    pose={fn:[-30*s,40*s*(1-0.5*t)],ff:[-24*s-4,36*s*(1-0.4*t)],bn:[lerp(36,6,t),34*s],bf:[lerp(30,4,t),30*s]};
  }
}

/* ---------- 方塊幾何 ---------- */
function cubeGeom(m,text){
  const c=XA+S*(m+0.5-T);                         // 該秒數字中心 x
  ctx.font='bold '+(U*0.095)+'px '+FONTF;
  const w=Math.max(U*0.34,ctx.measureText(text).width+U*0.1),h=U*0.18;
  return {x:c+0.55*u-w/2,w:w,h:h,cx:c};
}

/* ---------- 繪製 ---------- */
function outlineText(t,x,y,size,fill,stroke,align){
  ctx.font='bold '+size+'px '+FONTF;
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=size*0.16;ctx.strokeStyle=stroke||'#2f6f3a';
  ctx.strokeText(t,x,y);ctx.fillStyle=fill||'#fff';ctx.fillText(t,x,y);
}
function drawSky(){
  const dist=(T-T0)*S;
  const g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,'#38a9ff');g.addColorStop(0.5,'#8fdcff');g.addColorStop(1,'#f0fcff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GY+H*0.2);
  {const rc=['#ff5a5a','#ff9a3c','#ffe03c','#5fe05f','#3cc8ff','#5a7dff','#b45aff'],R=U*0.56,bw=U*0.04,cxr=W*0.5,cyr=GY+H*0.01;
   ctx.globalAlpha=0.5;ctx.lineWidth=bw+1;
   rc.forEach((c,i)=>{ctx.strokeStyle=c;ctx.beginPath();ctx.arc(cxr,cyr,R-i*bw,Math.PI,0);ctx.stroke()});
   ctx.globalAlpha=1}
  const span=W+U*0.8;
  ctx.fillStyle='rgba(255,255,255,.95)';
  for(let i=0;i<5;i++){
    const w=U*(0.3+hsh(i)*0.2),h=w*0.28;
    let x=((i*span/5+hsh(i+9)*80-dist*0.035-clock*4)%span+span)%span-U*0.4;
    const y=H*(0.25+hsh(i+4)*0.2);
    ctx.beginPath();ctx.ellipse(x+w/2,y,w/2,h/2,0,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*0.32,y-h*0.25,h*0.62,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*0.6,y-h*0.2,h*0.5,0,7);ctx.fill();
  }
}
function hill(color,base,amp,freq,speed,ph,dist){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,GY+H*0.2);
  for(let x=0;x<=W+10;x+=10){
    const t=(x+dist*speed)*freq+ph;
    ctx.lineTo(x,base-amp*(0.5+0.5*Math.sin(t))-amp*0.3*Math.sin(t*2.3+1.3));
  }
  ctx.lineTo(W+10,GY+H*0.2);ctx.closePath();ctx.fill();
}
function drawButterflies(dist){
  const bc=['#ff6fa5','#ffd23f','#c18bff','#5fc3ff','#ff8a3d'];
  for(let i=0;i<5;i++){
    const sp=18+hsh(i)*14,x=(((i*W/5+hsh(i+3)*90+clock*sp-dist*0.12)%(W+140))+(W+140))%(W+140)-70;
    const y=GY-U*(0.3+0.5*hsh(i+7))+Math.sin(clock*2.2+i*2)*U*0.03+Math.sin(clock*0.7+i)*U*0.03;
    const fl=Math.abs(Math.sin(clock*11+i*1.7)),r=U*0.03;
    ctx.fillStyle=bc[i];
    ctx.beginPath();ctx.ellipse(x-r*0.55*fl,y-r*0.3,r*0.7*fl+1,r*0.9,-0.4,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.55*fl,y-r*0.3,r*0.7*fl+1,r*0.9,0.4,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();ctx.ellipse(x-r*0.45*fl,y+r*0.35,r*0.45*fl+1,r*0.55,0.5,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.45*fl,y+r*0.35,r*0.45*fl+1,r*0.55,-0.5,0,7);ctx.fill();
    ctx.fillStyle='#4a3a6a';ctx.fillRect(x-1,y-r*0.6,2,r*1.4);
  }
}
function drawGround(dist){
  hill('#c4f58f',GY-H*0.035,U*0.16,3.2/U,0.15,0.5,dist);
  hill('#9cec6a',GY-H*0.008,U*0.1,4.6/U,0.32,2.0,dist);
  const g=ctx.createLinearGradient(0,GY-H*0.05,0,H);
  g.addColorStop(0,'#94ea4a');g.addColorStop(0.5,'#6edb34');g.addColorStop(1,'#52c224');
  ctx.fillStyle=g;ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#c2ff78';ctx.fillRect(0,GY-Math.max(1,U*0.006),W,Math.max(3,U*0.012));
  const cell=U*0.1,i0=Math.floor(dist/cell)-2,i1=Math.ceil((dist+W)/cell)+2;
  const cols=['#2fa81e','#8cf05a','#3cc02a','#c2ff78'],bh=H-GY;
  ctx.lineWidth=Math.max(1.5,U*0.008);ctx.lineCap='round';
  for(let r=0;r<4;r++)for(let i=i0;i<=i1;i++){
    const kk=i*7+r*131,a=hsh(kk),b=hsh(kk+1.7),c=hsh(kk+3.3);
    const x=i*cell+a*cell-dist,y=GY+((r+b)/4)*bh*0.93+bh*0.04,hh=U*(0.02+((y-GY)/bh)*0.05);
    ctx.strokeStyle=cols[Math.floor(c*4)];ctx.beginPath();
    ctx.moveTo(x,y);ctx.quadraticCurveTo(x+(c-.5)*5,y-hh*.5,x+(a-.5)*9,y-hh);
    ctx.moveTo(x+3,y);ctx.quadraticCurveTo(x+4,y-hh*.4,x+(b-.5)*8+4,y-hh*.8);ctx.stroke();
  }
  const fc=['#ff6fa5','#ffd23f','#ffffff','#ff8a3d','#c18bff','#5fc3ff','#ff5d5d'];
  for(let i=Math.floor(i0/2);i<=Math.ceil(i1/2);i++){
    if(hsh(i*3.1+99)<0.45)continue;
    const x=i*cell*2+hsh(i)*cell-dist,y=GY+bh*(0.12+hsh(i+5)*0.7),r=U*0.014;
    ctx.fillStyle=fc[Math.floor(hsh(i+8)*7)];
    for(let p=0;p<5;p++){const a=p*Math.PI*0.4;ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r*0.7,r*0.7,0,7);ctx.fill()}
    ctx.fillStyle='#f6c200';ctx.beginPath();ctx.arc(x,y,r*0.6,0,7);ctx.fill();
  }
}
/* 3D 數字（沿用原檔 3D 英文字母的畫法） */
function numSprite(txt){
  if(sprCache[txt])return sprCache[txt];
  const fs=U*0.24,dep=fs*0.14,pad=Math.ceil(fs*0.1),L=9,gap=fs*0.1;
  ctx.font='bold '+fs+'px '+FONTF;
  const cw0=Array.from(txt).map(c=>ctx.measureText(c).width);
  const w=cw0.reduce((a,b)=>a+b,0)+gap*(txt.length-1);
  const cw=Math.ceil(w+dep+pad*2),by=Math.ceil(pad+dep+fs*0.78),ch=Math.ceil(by+fs*0.28+pad);
  const c0=document.createElement('canvas');c0.width=Math.ceil(cw*dpr);c0.height=Math.ceil(ch*dpr);
  const c=c0.getContext('2d');c.scale(dpr,dpr);
  c.font='bold '+fs+'px '+FONTF;c.textAlign='left';c.textBaseline='alphabetic';c.lineJoin='round';
  let x=pad;const ci=+txt%6;
  Array.from(txt).forEach((chr,i)=>{
    const col=LCOL[(i+ci)%LCOL.length];
    c.lineWidth=fs*0.06;c.fillStyle=col[1];c.strokeStyle=col[1];
    for(let d=L;d>=1;d--){const o=dep*d/L;c.fillText(chr,x+o,by-o);c.strokeText(chr,x+o,by-o)}
    c.lineWidth=fs*0.08;c.strokeStyle='#ffffff';c.strokeText(chr,x,by);
    c.fillStyle=col[0];c.fillText(chr,x,by);
    x+=cw0[i]+gap;
  });
  return sprCache[txt]={cv:c0,w:w,cw:cw,ch:ch,by:by,pad:pad,fs:fs};
}
function drawNum(m,sec){
  const sp=numSprite(String(sec)),cx=XA+S*(m+0.5-T),x=cx-sp.w/2;
  if(x>W+U*0.3||x+sp.w<-U*0.3)return;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(cx+sp.fs*0.07,GY+U*0.008,sp.w*0.6,U*0.02,0,0,7);ctx.fill();
  ctx.drawImage(sp.cv,Math.round((x-sp.pad)*dpr)/dpr,Math.round((GY-sp.by)*dpr)/dpr,sp.cw,sp.ch);
}
function drawStar(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
  ctx.closePath();ctx.fillStyle='#ffd400';ctx.fill();
  ctx.lineJoin='round';ctx.lineWidth=Math.max(1,r*0.14);ctx.strokeStyle='#e08a00';ctx.stroke();
}
/* 3D 立方盒子（顯示「時:分」，被小狗頂到會變金色並彈起） */
function drawCube(m,text){
  const g=cubeGeom(m,text),w=g.w,h=g.h,d=h*0.28,h0=hits[m]||{hit:0,t:0};
  if(g.x>W+U||g.x+w<-U)return;
  let yo=0;
  if(h0.hit){yo=-U*0.1*Math.sin(Math.PI*Math.min(1,h0.t/0.5))}
  const x=Math.round(g.x*dpr)/dpr,top=Math.round((GY-HB-h+yo)*dpr)/dpr;
  let col=CUBEC[((m%3)+3)%3];
  if(h0.hit)col=['#ffd84a','#ffe98a','#c99a00'];
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(g.cx+d/2,GY+U*0.01,w*0.5,U*0.016,0,0,7);ctx.fill();
  ctx.lineJoin='round';ctx.lineWidth=Math.max(1.5,U*0.008);ctx.strokeStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x+d,top-d);ctx.lineTo(x+w+d,top-d);ctx.lineTo(x+w,top);ctx.closePath();
  ctx.fillStyle=col[1];ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w,top);ctx.lineTo(x+w+d,top-d);ctx.lineTo(x+w+d,top+h-d);ctx.lineTo(x+w,top+h);ctx.closePath();
  ctx.fillStyle=col[2];ctx.fill();ctx.stroke();
  ctx.fillStyle=col[0];ctx.fillRect(x,top,w,h);ctx.strokeRect(x,top,w,h);
  outlineText(text,x+w/2,top+h/2+U*0.005,U*0.095,'#ffffff','#1f3a5f');
}
function drawPuppy(){
  if(loaded<total)return;
  const gyD=GY+U*0.012,sc=u/VBH;
  const hAir=Math.min(1,Math.max(0,dogZ)/(HP*1.2));
  ctx.fillStyle='rgba(0,0,0,'+(0.24-0.12*hAir)+')';
  ctx.beginPath();ctx.ellipse(dogX,gyD+U*0.008,u*1.45*(1-0.3*hAir)/2*1.1,U*0.02,0,0,7);ctx.fill();
  ctx.save();
  ctx.translate(dogX,gyD-(dogZ+bob));
  ctx.scale(sc*sx*dogScaleW,sc*sy);ctx.rotate(lean*D);
  ctx.translate(-VBW/2,-VBH);
  drawDog(pose,tailAng);
  ctx.restore();
}
function fitText(str,cx,cy,maxW,size,fill,stroke){        // 固定欄寬的時間字（避免數字跳動）
  const cell=ch=>/[0-9]/.test(ch)?0.62:ch===':'?0.34:ch===' '?0.3:1.02;
  let tw=0;for(const ch of str)tw+=cell(ch)*size;
  if(tw>maxW){size*=maxW/tw;tw=maxW}
  let x=cx-tw/2;
  ctx.font='bold '+size+'px '+FONTF;ctx.textBaseline='middle';ctx.textAlign='center';
  ctx.lineJoin='round';ctx.lineWidth=size*0.14;
  for(const ch of str){
    const w=cell(ch)*size;
    ctx.strokeStyle=stroke;ctx.strokeText(ch,x+w/2,cy);ctx.fillStyle=fill;ctx.fillText(ch,x+w/2,cy);x+=w;
  }
}
function drawTop(){
  const m=Math.floor(T),inf=info(m)||info(cfg.end)||{line1:cfg.label,line2:'00:00:00'};
  const l1=inf.line1;
  let fs1=U*0.095;ctx.font='bold '+fs1+'px '+FONTF;
  const w1=ctx.measureText(l1).width;if(w1>W*0.82)fs1*=W*0.82/w1;
  outlineText(l1,W/2,H*0.155,fs1,'#fff','#2f6f3a');
  fitText(inf.line2,W/2,H*0.155+U*0.2,W*0.94,U*0.21,'#fff','#2f6f3a');
  if(cfg.mode==='clock')outlineText(lunarOf(m),W/2,H*0.155+U*0.37,U*0.075,'#fff7c2','#2f6f3a');
  if(cfg.mode==='cd'&&!finished)outlineText('倒數計時中',W/2,H*0.155+U*0.37,U*0.06,'#fff7c2','#2f6f3a');
  if(finished){
    const a=0.8+0.2*Math.sin(clock*6);ctx.globalAlpha=a;
    outlineText('🎉 時間到！',W/2,H*0.35,U*0.14,'#ffe14a','#b25a00');ctx.globalAlpha=1;
  }
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const dist=(T-T0)*S;
  drawSky();drawGround(dist);drawButterflies(dist);
  if(loaded>=total){
    const mNow=Math.floor(T);
    for(let m=mNow-2;m<=mNow+3;m++){
      const inf=info(m);if(!inf)continue;
      drawNum(m,inf.sec);
      if(inf.sec===0)drawCube(m,inf.block);
    }
  }
  drawPuppy();
  for(const st of stars){
    const p=st.t/1.2,e=1-(1-p)*(1-p),x=st.wx,y=st.y0-U*(0.06+0.3*e),r=U*0.07*(p<0.15?p/0.15:1);
    ctx.globalAlpha=p>0.7?Math.max(0,(1-p)/0.3):1;drawStar(x,y,r,st.t*6);ctx.globalAlpha=1;
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.l/0.4));
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawTop();
  if(loaded<total)outlineText('載入中…',W/2,H*0.45,U*0.1);
}

let fsTried=false;
function enterFS(){
  try{
    const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq&&!document.fullscreenElement&&!document.webkitFullscreenElement){
      Promise.resolve(rq.call(el)).then(()=>{
        if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});
      }).catch(()=>{});
    }
  }catch(e){}
}
function toggleFS(){
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();
    }else enterFS();
  }catch(e){}
}
const $=id=>document.getElementById(id);
$('fs').addEventListener('click',e=>{e.stopPropagation();toggleFS()});

  if(!fsTried){fsTried=true;enterFS()}
},{capture:true}));
function refreshSnd(){if(barkMaster)barkMaster.gain.value=muted?0:1;$('snd').textContent=(muted||!sndArmed)?'🔇':'🔊'}
$('snd').addEventListener('click',e=>{e.stopPropagation();if(!sndArmed){sndArmed=true;muted=false}else muted=!muted;refreshSnd()});

/* ---------- 地平線下的設定面板 ---------- */
const tp=new Date(Date.now()+28800000);
const nowROC=tp.getUTCFullYear()-1911;
function fill(sel,from,to,fmt,val){
  const el=$(sel);el.innerHTML='';
  for(let i=from;i<=to;i++){const o=document.createElement('option');o.value=i;o.textContent=fmt?fmt(i):i;el.appendChild(o)}
  if(val!==undefined)el.value=val;
}
fill('tY',nowROC,nowROC+30,null,nowROC);
fill('tMo',1,12,null,tp.getUTCMonth()+1);
function fillDays(){
  const y=+$('tY').value+1911,mo=+$('tMo').value,n=new Date(Date.UTC(y,mo,0)).getUTCDate(),cur=+$('tD').value||tp.getUTCDate();
  fill('tD',1,n,null,Math.min(cur,n));
}
fillDays();
fill('tH',0,23,pad2,(tp.getUTCHours()+1)%24);fill('tMi',0,59,pad2,0);fill('tS',0,59,pad2,0);
fill('dH',0,99,null,0);fill('dMi',0,59,pad2,0);fill('dS',0,59,pad2,0);
$('tY').onchange=$('tMo').onchange=fillDays;
let selMode='clock';
function showMode(m){
  selMode=m;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('rowT').classList.toggle('show',m==='target');$('rowD').classList.toggle('show',m==='dur');
  setNote(m==='clock'?'':m==='target'?'選擇要倒數到的日期與時間':'選擇要倒數多久',false);
}
function setNote(t,err){$('note').style.display=t?'block':'none';$('note').textContent=t;fitGY();$('note').className=err?'err':''}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>showMode(b.dataset.m)));
function setCfg(c){
  cfg=c;hits={};finished=false;bump=null;
  try{localStorage.setItem('puppyClockCfg',JSON.stringify(c))}catch(e){}
  scheduleBarks();bgCheck();
}
$('ok').addEventListener('click',()=>{
  const now=Date.now()/1000;
  if(finished){                                   // 鈴響中按確定：停止狗叫並回到「目前時間」
    stopBarking();
    setCfg({mode:'clock',end:0,label:''});
    showMode('clock');setNote('',false);return;
  }
  if(selMode==='clock'){setCfg({mode:'clock',end:0,label:''});setNote('',false);return}
  if(selMode==='target'){
    const y=+$('tY').value,mo=+$('tMo').value,d=+$('tD').value,h=+$('tH').value,mi=+$('tMi').value,s=+$('tS').value;
    const end=Math.round(Date.UTC(y+1911,mo-1,d,h,mi,s)/1000-28800);
    if(end<=now){setNote('請選擇「未來」的日期時間',true);return}
    setCfg({mode:'cd',end:end,label:'至 '+y+'年'+mo+'月'+d+'日 '+pad2(h)+':'+pad2(mi)+':'+pad2(s)});
    setNote('倒數開始！',false);return;
  }
  const dur=(+$('dH').value)*3600+(+$('dMi').value)*60+(+$('dS').value);
  if(dur<=0){setNote('請設定大於 0 的倒數時間',true);return}
  setCfg({mode:'cd',end:Math.floor(now)+dur,label:'倒數 '+$('dH').value+' 時 '+$('dMi').value+' 分 '+$('dS').value+' 秒'});
  setNote('倒數開始！',false);
});
showMode('clock');

</script>
</body>
